name: kaggle-shard

on:
  workflow_dispatch:
    inputs:
      index:
        description: "shard index (0..count-1)"
        required: true
        default: "0"
      count:
        description: "number of shards"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install kaggle==2.2.4

      - name: Run shard on Kaggle Benchmarks
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_DATASET: dhammagift/rename-mn
        run: |
          python work/run_shard.py \
            --index "${{ inputs.index }}" \
            --count "${{ inputs.count }}"

      - name: Upload shard output
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ inputs.index }}
          path: results/full/shard-${{ inputs.index }}/
          if-no-files-found: error
